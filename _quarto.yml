project:
  type: website
  output-dir: "docs"
  execute-dir: project
  render:
    - "films/*.qmd"
    - "resources/**"
    - "!resources/*/_*/**"
    - "*_resources.qmd"
    - "*/schedule.qmd"
    - "syllabi/*.qmd"
    - "!syllabi/_*.qmd"
    - "*/index.qmd"
    - index.qmd
    - "!_archive/**"
    - "*/_*/**"
    - "*/*/_*/**"
execute:
  freeze: auto

website:
  open-graph: true
  title: "Course Information"
  favicon: images/logo_richlab.png
  description: "Courses at UNO taught by Dr. Alicia Rich"
  navbar:
    class: "navbar navbar-expand-lg bg-dark"
    data-bs-theme: "dark"
    logo-alt: "Rich Lab Website"
    left:
      - text: "Conservation Biology"
        menu:
          - text: "Course Homepage"
            href: "conbio/index.qmd"
          - text: "Schedule"
            href: "conbio/schedule.qmd"
          - text: "Syllabus"
            href: "syllabi/conbio.qmd"
          - text: "Resources"
            href: "conbio_resources.qmd"
      - text: "Human Health & the Environment"
        menu:
          - text: "Course Homepage"
            href: "hhe/index.qmd"
          - text: "Schedule"
            href: "hhe/schedule.qmd"
          - text: "Syllabus"
            href: "syllabi/hhe.qmd"
          - text: "Resources"
            href: "hhe_resources.qmd"
      - text: "Biology 2 Lab"
        menu:
          - text: "Resources"
            href: "bio2lab_resources.qmd"
    right:
      - text: "Book a Meeting"
        href: "https://outlook.office.com/bookwithme/user/c35af21f7b904e7d82e5cffc9144bce2@nebraska.edu/meetingtype/OBbQKPv_8U-i7oMmPayEZg2?anonymous&ismsaljsauthenabled&ep=mlink"
        icon: "calendar-event"
      - text: "Email Me"
        href: "mailto:aliciarich@unomaha.edu"
        icon: "envelope-at"
  page-footer: "Copyright 2026, Dr. Alicia M. Rich"

profile:
  group:
    - [basic, schedule, syllabus, slides, resource, listings, film]
  default: basic