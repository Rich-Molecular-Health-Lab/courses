project:
  type: website
  output-dir: "docs"
  execute-dir: project
  render:
    - films/*.qmd
    - resources/conbio/*/*.qmd
    - resources/hhe/*/*.qmd
    - resources/bio2lab/*.qmd
    - conbio_resources.qmd
    - hhe_resources.qmd
    - bio2lab_resources.qmd
    - slides/conbio/*.qmd
    - slides/hhe/*.qmd
    - conbio/schedule.qmd
    - hhe/schedule.qmd
    - conbio_slides.qmd
    - bio2lab_slides.qmd
    - hhe_slides.qmd
    - conbio/syllabus.qmd
    - hhe/syllabus.qmd
    - conbio/index.qmd
    - hhe/index.qmd
    - index.qmd
execute:
  freeze: auto

website:
  open-graph: true
  title: "Course Information"
  favicon: images/logo_richlab.png
  description: "Courses at UNO taught by Dr. Alicia Rich"
  navbar:
    class: "navbar navbar-expand-lg bg-dark"
    data-bs-theme: "dark"
    logo-alt: "Rich Lab Website"
    left:
      - text: "Conservation Biology"
        menu:
          - text: "Course Homepage"
            href: "conbio/index.qmd"
          - text: "Schedule"
            href: "conbio/schedule.qmd"
          - text: "Slide Decks"
            href: "conbio_slides.qmd"
          - text: "Syllabus"
            href: "conbio/syllabus.qmd"
          - text: "Resources"
            href: "conbio_resources.qmd"
      - text: "Human Health & the Environment"
        menu:
          - text: "Course Homepage"
            href: "hhe/index.qmd"
          - text: "Schedule"
            href: "hhe/schedule.qmd"
          - text: "Slide Decks"
            href: "hhe_slides.qmd"
          - text: "Syllabus"
            href: "hhe/syllabus.qmd"
          - text: "Resources"
            href: "hhe_resources.qmd"
      - text: "Biology 2 Lab"
        menu:
          - text: "Slide Decks"
            href: "bio2lab_slides.qmd"
          - text: "Resources"
            href: "bio2lab_resources.qmd"
    right:
      - text: "Book a Meeting"
        href: "https://outlook.office.com/bookwithme/user/c35af21f7b904e7d82e5cffc9144bce2@nebraska.edu/meetingtype/OBbQKPv_8U-i7oMmPayEZg2?anonymous&ismsaljsauthenabled&ep=mlink"
