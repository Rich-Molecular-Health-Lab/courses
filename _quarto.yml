project:
  type: website
  output-dir: "docs"
  execute-dir: project
  render:
    - films/*.qmd
    - resources/conbio/*/*.qmd
    - resources/bio2lab/*.qmd
    - slides/conbio/*.qmd
    - slides/hhe/*.qmd
    - conbio_slides.qmd
    - hhe_slides.qmd
    - conbio/schedule.qmd
    - conbio/syllabus.qmd
    - hhe/syllabus.qmd
    - conbio/index.qmd
    - hhe/index.qmd
    - index.qmd
execute:
  freeze: auto

website:
  open-graph: true
  title: "Course Information"
  favicon: images/logo_richlab.png
  description: "Courses at UNO taught by Dr. Alicia Rich"
  navbar:
    class: "navbar navbar-expand-lg bg-dark"
    data-bs-theme: "dark"
    logo-alt: "Rich Lab Website"
    left:
      - text: "Conservation Biology"
        menu:
          - text: "Course Homepage"
            href: "conbio/index.qmd"
          - text: "Current Schedule"
            href: "conbio/schedule.qmd"
          - text: "Syllabus"
            href: "conbio/syllabus.qmd"
          - text: "Slide Decks"
            href: "conbio_slides.qmd"
          - text: "Resources"
            href: "conbio_resources.qmd"
      - text: "Biology 2 Lab"
        menu:
          - text: "Slide Decks"
            href: "bio2lab_slides.qmd"
          - text: "Resources"
            href: "bio2lab_resources.qmd"
      - text: "Human Health & the Environment"
        menu:
          - text: "Course Homepage"
            href: "hhe/index.qmd"
          - text: "Syllabus"
            href: "hhe/syllabus.qmd"
    right:
      - text: "Book a Meeting"
        href: "https://outlook.office.com/bookwithme/user/c35af21f7b904e7d82e5cffc9144bce2@nebraska.edu/meetingtype/OBbQKPv_8U-i7oMmPayEZg2?anonymous&ismsaljsauthenabled&ep=mlink"
        icon: "calendar-event"

date-modified: today
date-format: "ddd MMM D, YYYY"
format:
  html:
    toc: true
    toc-depth: 4
    toc-location: left
    toc-title: "Contents"
    theme: flatly
    page-layout: full
    smooth-scroll: true
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Anaheim:wght@400..800&family=Cabin+Condensed:wght@400;500;600;700&family=Yaldevi:wght@200..700&display=swap" rel="stylesheet">

editor: source

