format:
  revealjs:
    toc: false
    toc-depth: 2
    incremental: true
    slide-number: true
    smaller: true
    theme:
      - solarized
      - style/mtmkinley.scss
    css:
      - style/headings.css
      - style/slides.css
      - style/custom.css
    author: "Dr. Alicia M. Rich"
    transition: slide
    background-transition: fade
    auto-animate: true
  letterbox-revealjs:
    css: [style/timeline.css, style/hex.css, style/custom.css]
    progress: true
    auto-animate: true
    menu: true
    preview-links: true
title-slide-classes: [title-right-img]
title-slide-attributes:
  data-background-image: backgrounds/4.png
  data-background-position: contain
  data-background-opacity: "0.5"
  class: "center middle"
callout-appearance: simple