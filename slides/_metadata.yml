format:
  revealjs:
    toc: false
    toc-depth: 2
    incremental: true
    slide-number: true
    smaller: true
    theme:
      - solarized
      - style/mtmkinley.scss
    css:
      - style/headings.css
      - style/slides.css
      - style/custom.css
    transition: slide
    background-transition: fade
    auto-animate: true
    title-slide: false
  letterbox-revealjs:
    title-slide-attributes:
      data-visibility: hidden
    css: [style/timeline.css, style/hex.css, style/custom.css]
    progress: true
    auto-animate: true
    menu: true
    preview-links: true
    show-slide-number: speaker
callout-appearance: simple
author: "Dr. Alicia M. Rich"