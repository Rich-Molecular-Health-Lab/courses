project:
  output-dir: "to_print"
  execute-dir: project
  render:
    - handouts/*.qmd

author: "Dr. Alicia M. Rich"
date-modified: today
date-format: "ddd MMM D, YYYY"
format:
  pdf:
    pdf-engine: xelatex
    documentclass: article
    geometry:
      - top=1in
      - left=1in
  docx:
    toc: true
    number-sections: true
    reference-doc: "handout-doc.docx"
  html:
    theme: flatly
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: false
    page-layout: full

editor: source

