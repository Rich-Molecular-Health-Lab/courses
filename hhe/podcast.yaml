  series_description: "The surprising connections in science and technology that give you the Big Picture. Astronomer Seth Shostak and science journalist Molly Bentley are joined each week by leading researchers, techies, and journalists to provide a smart and humorous take on science. Our regular 'Skeptic Check' episodes cast a critical eye on pseudoscience."
