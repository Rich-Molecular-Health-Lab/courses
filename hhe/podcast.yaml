  title: "Should we reengineer the world's deadliest animal?"
  url_spotify: "https://open.spotify.com/episode/4pXSr8F6Z539jrtjxdMGy3"
  description: "The most ferocious predator for us humans is actually quite small: the mosquito. They are hungry for blood, spreading diseases like malaria, yellow fever and dengue – and picking up new ones all the time. But what if we could wipe out the mosquito? Gene-editing technology could do it, potentially saving millions of lives. But it comes with serious potential for risk. Which begs the question: Should we get to decide when humanity rewrites nature? Here to discuss that is Ben Bradford, the host of a new podcast distributed by the NPR Network: Are We Doomed?Interested in more science? Email us your question at shortwave@npr.org.Listen to every episode of Short Wave sponsor-free and support our work at NPR by signing up for Short Wave+ at plus.npr.org/shortwave.See pcm.adswizz.com for information about our collection and use of personal data for sponsorship and to manage your podcast sponsorship preferences.NPR Privacy Policy"
