  title: "Preventing Future Pandemics"
  url_spotify: "https://open.spotify.com/episode/5VIUXP2GLfOITKOogyXgHv"
  description: "We may not want to think about another pandemic, but, as epidemiologists say, it is once again a “when,” not “if,” scenario. For his latest book, journalist Jon Cohen, who has written extensively about infectious disease for the magazine Science, interviewed top epidemiologists around the world and followed virus hunters into damp and daunting bat caves to assess our pandemic preparedness readiness. Jon and Molly sit down before an audience in Los Angeles to talk about worrisome cuts to science funding and our ability (or inability) to be vigilant and respond quickly to emerging disease. There is good news: we know how to stop outbreaks. The question is, will we put our tools and vast knowledge to use?  Guest:  Jon Cohen – senior correspondent with Science Magazine, author of “Planning Miracles: How to Prevent Future Pandemics”  Reading: The Trump Administration is Dismantling Efforts to Fight the Next Pandemic  Big Picture Science is part of the Airwave Media podcast network. Please contact advertising@airwavemedia.com to inquire about advertising on Big Picture Science.  You can get early access to ad-free versions of every episode by joining us on Patreon. Thanks for your support!     Learn more about your ad choices. Visit megaphone.fm/adchoices"
  released: "2026-05-11"
