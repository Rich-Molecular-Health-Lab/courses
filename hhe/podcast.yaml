  title: "Animal Diseases and Human Health: The Sloth and Screwworm Episode"
  url_spotify: "https://open.spotify.com/episode/4V0aoyBiprLCm4B6F4wAfT"
  description: "About this episode:   Headlines about sick sloths in Florida and the reemergence of the New World screwworm in the southwest are raising concerns about potential animal-to-human spillover of certain diseases. In this episode: an update on gammaherpesvirus at Sloth World, why experts are concerned about new screwworm cases, and what both of these situations may mean for human health. Guest:  Dr. Meghan Davis, PhD, MPH, is a veterinarian and chair of the Master of Public Health program at the Johns Hopkins Bloomberg School of Public Health. Host:   Lindsay Smith Rogers, MA, is the producer of the Public Health On Call podcast, an editor for Expert Insights, and the director of content strategy for the Johns Hopkins Bloomberg School of Public Health.  Show links and related content:    Mass Sloth Deaths in Florida Are a Warning About Wildlife Trade and Pandemic Risk, Scientists Say—Inside Climate News   USDA Confirms Presence of New World Screwworm in the United States—USDA   Could One Health Prevent the Next Pandemic?—Public Health On Call (September 2025)   Transcript information: Looking for episode transcripts? Open our podcast on the Apple Podcasts app (desktop or mobile) or the Spotify mobile app to access an auto-generated transcript of any episode. Closed captioning is also available for every episode on our YouTube channel. Contact us: Have a question about something you heard? Looking for a transcript? Want to suggest a topic or guest? Contact us via email or visit our website. Follow us:   @‌PublicHealthPod on Bluesky   @‌PublicHealthPod on Instagram   @‌JohnsHopkinsSPH on Facebook   @‌PublicHealthOnCall on YouTube   Here's our RSS feed   Note: These podcasts are a conversation between the participants, and do not represent the position of Johns Hopkins University."
