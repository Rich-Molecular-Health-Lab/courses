  title: "06 - From Redlining to Inclusive Planning"
  url_spotify: "https://open.spotify.com/episode/6Bbzj0S37EBZladi54d3Dr"
  description: "The Planning Accreditation Board (PAB) and AICP Code of Ethics highlight the importance of justice, equity, diversity, and inclusion (DEI) in urban planning. Planners must promote social justice, fair resource distribution, and support historically disadvantaged groups. Practical tools from the PAS Report address housing, transportation, and public health for communities of color. Historical segregation practices, like redlining, contrast with modern equitable development efforts. Effective stakeholder engagement uses conflict resolution, consensus building, mediation, and arbitration. Environmental justice, mandated by Executive Order 12898, ensures equal protection from hazards. Equitable taxation policies and participatory budgeting are essential. Policy and fiscal impact analyses guide informed decisions. By upholding DEI values, planners create more inclusive urban environments."
  released: "2024-07-26"
