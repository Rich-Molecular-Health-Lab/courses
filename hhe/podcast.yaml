  title: "What we lose if the Great Salt Lake dries up"
  url_spotify: "https://open.spotify.com/episode/1fd8eq7653xN4mr4D29EWD"
  description: "Dotted across the Great Basin of the American West are salty, smelly lakes. The largest of these, by far, is the Great Salt Lake in Utah.But a recent report found that water diversions for farming, climate change and population growth could mean the lake essentially disappears within five years. Less water going in means higher concentrations of salt and minerals, which threatens the crucial ecological role saline lakes play across the West, as well as the health of the people who live nearby. On today's episode, Kirk takes Short Wave co-host Aaron Scott on an audio field trip to the endangered Great Salt Lake, and explains why losing the lake could be devastating for everyone from brine flies to the humans that live next door. See pcm.adswizz.com for information about our collection and use of personal data for sponsorship and to manage your podcast sponsorship preferences.NPR Privacy Policy"
