  series: "Urban Planning Foundations "
  series_description: "Welcome to Urban Planning Foundations! This podcast is part of an Urban Planning Theory & History course developed by Dr. Ivis Garcia for the Texas A&M University Masters of Urban Planning program, but it’s also an invaluable resource for practicing and aspiring planners everywhere. Whether you're a student, a seasoned planner, or an aspiring professional, this podcast offers key principles and practical information to enhance your understanding of urban planning and ace the AICP exam."
