  description: "The greatest mysteries have a shadowy figure at the center—someone who sets things in motion and holds the key to how the story unfolds. In epidemiology, this central character is known as Patient Zero—the case at the heart of an outbreak. This hour, Radiolab hunts for Patient Zeroes from all over the map. Hosted by Simplecast, an AdsWizz company. See pcm.adswizz.com for information about our collection and use of personal data for advertising."
