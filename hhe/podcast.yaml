  title: "How The Current Heat Dome Can Affect Human Health"
  url_spotify: "https://open.spotify.com/episode/5a3ZUmBQD6SAAPIJDPgaZK"
  description: "Right now, there's a 'heat dome' lingering over the southwestern U.S. – a high pressure system that pushes hot air down and traps it, raising the temperature. Heat is becoming increasingly lethal as climate change causes more extreme heat. So in today's encore episode, we're exploring heat. NPR climate correspondent Lauren Sommer talks with Short Wave host Regina G. Barber about how the human body copes with extended extreme heat and how today's heat warning systems could better protect the public. With scientists predicting a very hot summer, if you can, stay cool out there, dear Short Wavers.What science story do you want to hear next on Short Wave? Email us at shortwave@npr.org.See pcm.adswizz.com for information about our collection and use of personal data for sponsorship and to manage your podcast sponsorship preferences.NPR Privacy Policy"
