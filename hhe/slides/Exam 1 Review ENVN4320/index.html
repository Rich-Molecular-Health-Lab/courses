    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };

Which study design is most appropriate when investigating a disease that is rare and has a long latency period?
</div>



</div>

<div class="answers" style="position: absolute; left: 1%; top: 30%; height: 70%; width: 90%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="top">


<div class="block">

- Case-control study
- Cross-sectional study
- Cohort study
- Randomized controlled trial

</div>



</div>









 

<div class="footer-course" style="position: absolute; left: 0%; top: 85%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: start; justify-content: center" >
 
<div class="block">

ENVN 4320 Human Health & the Environment
</div>



</div> 

<div class="footer-copyrite" style="position: absolute; left: 74%; top: 85%; height: 5%; width: 25%; display: flex; flex-direction: column; align-items: start; justify-content: center" >
 

 © 2026 Alicia M. Rich, Ph.D.
 
</div>
</div>

<aside class="notes"><p>The correct answer is <strong>&quot;Case-control study.&quot;</strong> </p>
<p>The slides note that case-control studies are &quot;especially for diseases that are rare or have long latency,&quot; because cohort studies would be infeasible for rare conditions or diseases with long latency due to the time and cost required to follow large populations. Cross-sectional studies are not useful for rare conditions of very short duration, and RCTs are not specifically designed for studying rare diseases. (Source: Evidence and Hypothesis-Testing in Epidemiology)</p>
</aside></script></section><section data-separator="?

What is the key difference between misinformation and disinformation?
</div>



</div>

<div class="answers" style="position: absolute; left: 1%; top: 30%; height: 70%; width: 90%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="top">


<div class="block">

* Misinformation is spread by scientists, while disinformation is spread by the general public
* Misinformation is corrected easily, while disinformation cannot be corrected
* Misinformation is false information shared without intent to mislead, while disinformation is deliberately created and spread to deceive
* Misinformation affects only individuals, while disinformation affects entire populations


</div>



</div>









 

<div class="footer-course" style="position: absolute; left: 0%; top: 85%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

 © 2026 Alicia M. Rich, Ph.D.
 
</div>
</div>

<aside class="notes"><p>The correct answer is &quot;<strong>Misinformation is false information shared without intent to mislead, while disinformation is deliberately created and spread to deceive.</strong>&quot; </p>
<p>The slides define misinformation as &quot;False information shared without the intention to mislead&quot; and disinformation as &quot;False information deliberately created and spread to deceive or cause harm.&quot; The distinction hinges on intent, not on who spreads it, how easily it is corrected, or the scale of its impact. (Source: Evidence and Hypothesis-Testing in Epidemiology)</p>

Which of the following is the primary mechanism by which climate change is increasing wildfire area burned in North American forests?

</div>

<aside class="notes"><p><strong>Vegetation becomes drier, allowing fires to burn larger areas when ignited</strong></p>
<p>Hausfather explicitly states that &quot;the vegetation is drier, and so when a spark catches, it&#39;s more likely to burn a larger area.&quot; This drying of vegetation is the direct mechanism linking warming temperatures to increased burned area. While other factors like fire suppression and ignition sources are discussed in the sources, Hausfather identifies vegetation dryness as the primary driver of larger fires in North American forests. (Source: Podcast: Are extreme wildfires the new normal?)</p>

What was the primary trigger for the catastrophic flooding in Nepal?
</div>

<div class="answers" style="position: absolute; left: 1%; top: 30%; height: 70%; width: 90%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="top">


<div class="block">

* A massive chunk of glacier and bedrock collapsed high in the Himalayas, sending ice, rock, and debris down the mountainside
* Intense monsoon rainfall caused rivers to overflow their banks
* A glacial lake burst through its natural dam
* A series of earthquakes destabilized the valley floor

</div>



</div>









 

<div class="footer-course" style="position: absolute; left: 0%; top: 85%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

<div class="footer-copyrite" style="position: absolute; left: 74%; top: 85%; height: 5%; width: 25%; display: flex; flex-direction: column; align-items: start; justify-content: center" >
 

 © 2026 Alicia M. Rich, Ph.D.
 
</div>
</div>

<aside class="notes"><p>The correct answer is that a <strong>massive chunk of glacier and bedrock collapsed high in the Himalayas</strong>. </p>
<p>Multiple sources confirm that a glacier at just under 5,000 meters elevation essentially disappeared, and scientists found that glacier ice was part of a much larger mass of bedrock that collapsed, exploding as it descended a vertical kilometer to the valley bottom. This triggered the devastating floods. While monsoon season was occurring and glacial lakes are a concern in the region, the specific trigger in this disaster was the glacier and mountainside collapse. (Sources: &quot;As the climate changes, is the deadly flooding in Nepal a sign of things to come?&quot; and &quot;Why the Nepal flash flood was almost impossible to predict&quot;)</p>
</aside></script></section><section data-separator="?

Which of the following best explains why the urban heat island effect makes cities significantly hotter than surrounding rural areas?
</div>



</div>

<div class="answers" style="position: absolute; left: 1%; top: 30%; height: 70%; width: 90%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="top">


<div class="block">

* Cities receive more direct sunlight because tall buildings reflect clouds away from urban centers
* Urban surfaces such as concrete, asphalt, and brick absorb and store solar radiation as heat more effectively than natural surfaces
* Rural areas have stronger winds that carry cooler air, while cities block these winds with buildings
* Urban populations generate so much body heat that it raises the ambient temperature of the entire city

</div>



</div>









 

<div class="footer-course" style="position: absolute; left: 0%; top: 85%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

</div>

    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }
