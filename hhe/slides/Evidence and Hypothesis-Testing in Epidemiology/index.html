</div>

<div class="text-row" style="position: absolute; left: 1%; top: 6%; height: 10%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">










<div class="block">

<!-- .element: style="font-size: 13px; line-height: 1.2" -->

| Method | Definition | Use | Caveats |
| --- | --- | --- | --- |
| **Public health surveillance** | Continual, systematic monitoring of a disease/condition in a population, using data from different sources | Ongoing data on the occurrence and distribution of conditions; real-time warning of when and where an outbreak will occur | Requires rapid, efficient, long-term collaboration to collect and analyze data across health and other sectors |
| **Disease registries** | Legally mandated registration of all individuals in an area who contract a specific chronic disease, with longitudinal follow-up | Detailed incidence, duration, treatment, and outcomes of a disease to advise prevention and control policies | Expensive; follow-up is difficult, especially in low-income countries; needs long-term collaboration across facilities |
| **Health facility records** | Continuous, systematic reporting of health events, including mandatory reporting of notifiable diseases | Helps health departments plan control and prevention; contributes to knowledge of global disease patterns | Requires efficient, rapid information systems; trade-off between number of notifiable diseases and reporting workload |
| **Civil registration & vital statistics** | Mandatory, continuous recording of all births and deaths (and cause) in a population | Supports planning with birth rates, death rates, and causes of death | Not fully functional in many LMICs, where causes of death are hard to ascertain |

</div>








</div>

Scale of the Problem: Cross-sectional Study
</div>

 
</div> 


<div class="text-row" style="position: absolute; left: 1%; top: 6%; height: 10%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">


<div class="block">

*What is the prevalence of a disease/condition, where and among which groups is it prevalent?* A cross-sectional study takes random samples of individuals in a population at a point in time.
</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">


<div class="block">

<img src="4_System/43_Attachments/2_Areas/24_Teaching/ENVN4320_Human_Health_the_Environment/Evidence and Hypothesis-Testing in Epidemiology-1.png" alt="" style="object-fit: scale-down">

</div>

<!-- .element: class="fit-image" -->











<div class="block">

<div class="block">

<!-- .element: class="divider-list" -->
Prevalence Rate<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->The proportion of people in a population who have a condition of interest at a point in time (or, for *period prevalence*, during a period of time)
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Approach<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Describe the prevalence of the disease/condition by other characteristics of the population
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Use<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Informs about the scale, and demographic and geographical distribution of conditions
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Repeated surveys can establish trends and generate hypotheses
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Caveats<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Not useful for rare conditions of very short duration
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Hard to control for confounding or to attribute causality
</div>



</div>






</div>

Risk Factors: Cohort (Longitudinal) Study
</div>

 
</div> 


<div class="text-row" style="position: absolute; left: 1%; top: 6%; height: 10%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">


<div class="block">

*Which are the risk groups and factors associated with the disease/condition that an intervention could target?* A cohort study follows a well-defined population over time who are exposed to risk factors of interest.
</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">


<div class="block">

<img src="4_System/43_Attachments/2_Areas/24_Teaching/ENVN4320_Human_Health_the_Environment/Evidence and Hypothesis-Testing in Epidemiology-2.png" alt="" style="object-fit: scale-down">

</div>

<!-- .element: class="fit-image" -->











<div class="block">

<div class="block">

<!-- .element: class="divider-list" -->
Key Measures<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Incidence rate:** the proportion of people in a population who contract a condition during a period of time
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Relative risk (RR):** the ratio of the incidence of the outcome in a <mark>risk group</mark> to the incidence in a <mark>comparison group</mark>
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**RR = 1** → no association; **RR > 1** → positive association; **RR < 1** → negative association
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Approach<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Compare incidence of a disease/condition in those exposed and in those who are not (relative risk)
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Use<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Describes incidence and the course of the condition (prognosis)
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Identifies risk factors to target for interventions
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Caveats<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Takes time
- &shy;<!-- .element: class="fragment" data-fragment-index="8" -->Not feasible for rare conditions or diseases with long latency
- &shy;<!-- .element: class="fragment" data-fragment-index="9" -->Suitable cohorts can be difficult to identify and costly to follow
- &shy;<!-- .element: class="fragment" data-fragment-index="10" -->Ethical considerations include confidentiality and privacy
</div>



</div>






</div>

</div>

 
</div> 


<div class="text-row" style="position: absolute; left: 1%; top: 6%; height: 10%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">


<div class="block">

A case-control study selects a group of cases with a disease/condition and a group of controls without the condition (but otherwise similar), and records history of exposure to potential risk factors in both groups.
</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

<div class="block">

<div class="block">

<!-- .element: class="divider-list" -->
Odds Ratio (OR)<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->The ratio of the odds that an outcome occurs in a risk group to the odds that it occurs in a comparison group
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**For uncommon outcomes, the OR approximates the RR**
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Approach<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Examine the odds ratio as a measure of association
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Use<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Rapid way to establish (multiple) risk factors to target for interventions
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Especially for diseases that are rare or have long latency
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Caveats<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Information collected retrospectively
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Prone to confounding and measurement bias
- &shy;<!-- .element: class="fragment" data-fragment-index="8" -->Difficult to establish a temporal relationship between risk and the condition
- &shy;<!-- .element: class="fragment" data-fragment-index="9" -->Selecting a suitable control group can be difficult
</div>



</div>






</div>

<div class="text-row" style="position: absolute; left: 1%; top: 6%; height: 10%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">


<div class="block">

*Which intervention to recommend?* An RCT randomly assigns consenting participants, groups, or communities to an experimental treatment, or to a standard treatment, no treatment, or a placebo.
</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Mask assignment and limit the knowledge of treatment providers where possible
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Use<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Provides the best available evidence on the efficacy of treatments
</div>



<div class="block">

<!-- .element: class="divider-list" -->

- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Expensive and cumbersome

- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Study of harm is not feasible for ethical reasons
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Findings from field interventions may not generalize beyond the study context
</div>

note:
To test a hypothesis, the investigator needs to specify:

- The magnitude of a minimum detectable but clinically meaningful difference in the outcome they expect between the exposed and non-exposed groups
- The probability of wrongly concluding there is a difference (a Type I error, say 5%)
- The probability of wrongly concluding there is no difference (a Type II error, say 20%)

For cohort and case-control studies and surveys, investigators may select participants systematically or use sequential sampling: they select elements from the source population based on a random starting point, then use a fixed interval (usually based on sample size) to select all other elements. Explicit inclusion and exclusion criteria should define the target population and eligible participants. Specific working definitions for these criteria minimize misclassification of participants, particularly in designs requiring comparison with a control group.

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

<!-- .element: class="fit-image" -->











<div class="block">

**Confounding** happens when the third variable is associated with the exposure while also being a potential cause of the outcome.

3. Exclude spurious explanations for the association

</div>



</div>

<div class="block">

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
