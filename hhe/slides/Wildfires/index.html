        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };

Wildfire activity in the western U.S. has been increasing — a trend correlated with climate-driven changes in temperature and precipitation.

Unlike floods and hurricanes, wildfire's biggest human health threat often isn't the fire itself — it's what travels **hundreds to thousands of miles** downwind: smoke.

</div>

Collectively, **43 million people** live in areas with at least one "unhealthy" air-quality day per year because of wildfire smoke.

</div>

- Persistent coughing, phlegm, wheezing, difficulty breathing
- Reduced ability of the lungs to clear inhaled viruses and bacteria (some studies link smoke exposure to increased COVID-19 risk)
- Emerging evidence links short-term exposure to preterm birth and reduced cognitive performance
</div>

<div class="slide-image" style="position: absolute; left: 1%; top: 10%; height: 75%; width: 60%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

<div class="block">

- Wildfire smoke PM2.5 shows **stronger associations with asthma** than non-smoke PM2.5
- In Calgary, pediatric asthma exacerbations rose significantly during smoke events (13% increase in risk) — an effect not seen with general air pollution
- Among older adults with COPD, each rise in smoke PM2.5 was linked to measurably more respiratory hospitalizations
</div>

<div class="slide-image" style="position: absolute; left: 1%; top: 10%; height: 75%; width: 60%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

A National Bureau of Economic Research analysis estimated wildfire smoke contributes to nearly **16,000 U.S. deaths per year** — even hundreds of miles from the fire itself.

- **Older adults**, especially with existing COPD or cardiovascular disease
- **Pregnant people** — emerging evidence of preterm birth risk
- **Outdoor workers** — prolonged, unavoidable exposure
- People with asthma or other chronic respiratory conditions

- Use HEPA air purifiers or create a "clean room" at home

- Limit strenuous outdoor activity, especially for sensitive groups

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');

            document.body.classList.add('has-dark-background');
        }
