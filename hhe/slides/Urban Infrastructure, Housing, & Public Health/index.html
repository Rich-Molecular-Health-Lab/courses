        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };

Between 1960 and 2016, median rents rose 61% and median home values increased 112%. More than half of low-income American households now spend over 50% of their income on housing.

</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

<div class="block">

<div class="block">

<!-- .element: class="divider-list" -->
The Numbers<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Median rents rose **61%** since 1960
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Median home values rose **112%** since 1960
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**>50%** of low-income households are rent-burdened (paying >30% of income on rent)
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Eviction, foreclosure, and gentrification threaten housing stability
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Affluent Black families live in neighborhoods with higher poverty rates than poor White families
</div>



Housing affordability is not just an economic issue—it is a health equity issue.<!-- .element: class="feature" -->

</div>









</div>

Rent-burdened households—those paying more than 30% of monthly income on rent—experience measurable health harms:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Poorer self-rated health
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Higher rates of hypertension and arthritis
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Worse mental health outcomes
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Inability to afford food, medications, and child development resources

When families must choose between rent and medicine, housing cost becomes a direct pathway to disease.<!-- .element: class="feature fragment" -->

</div>









</div>

</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Moves disrupt social networks, health care routines, and children's schooling
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Evictions cause psychological trauma and constrain future housing options
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Natural disasters increasingly displace families, especially low-income households

</div>

Pediatric Health Benefits of Stable, Affordable Housing
</div>

 
</div> 


<div class="text-row" style="position: absolute; left: 1%; top: 6%; height: 10%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">


<div class="block">

Children in households that received vouchers for stable housing had lower rates of injury, asthma exacerbations, and victimization by crime. More recent research has corroborated the health benefits of stable housing.
</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">


<div class="block">

</div>

<!-- .element: class="fit-image" -->











<div class="block">

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Higher earnings and improved economic outcomes
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Fewer school absences for illness
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Fewer injuries
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Fewer asthma exacerbations *(shown in figure)*
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Improved mental health among children and caregivers
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Improved physical and mental health in children with medical complexity

</div>









</div>

<div class="block">

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

<div class="block">

Structural Issues<!-- .element: class="divider" -->
- Poor thermal comfort
- Water leaks and flooding
- Sagging roofs and cracked walls
</div>




<div class="block">

<!-- .element: class="divider-list fragment" -->
Biological Hazards<!-- .element: class="divider" -->

- Cockroach allergens triggering asthma
- Mold and moisture-related illness
</div>

Environmental Contaminants<!-- .element: class="divider" -->

- Asbestos in insulation and tiles
- Flame retardants in furniture and carpets
- Formaldehyde in building materials
</div>



</div>

Lead Poisoning: A Case Study in Housing Hazards

</div>

 
</div> 


<div class="text-row" style="position: absolute; left: 1%; top: 6%; height: 10%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">


<div class="block">

Lead-based paint was common in homes built before 1978. As paint deteriorates, it creates dust and chips that children ingest or inhale.
</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">


<div class="block">

<img src="4_System/40_Exports/ENVN4320/attachments/lead-poisoning-effects-diagram-scaled.jpg" alt="" style="object-fit: scale-down">


</div>

<!-- .element: class="fit-image" -->











<div class="block">

<div class="block">

<!-- .element: class="divider-list" -->
Health Effects in Children<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Reduced IQ and attention span
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Behavioral changes and increased antisocial behavior
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Anemia, hypertension, and kidney damage
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Immunotoxicity and reproductive harm
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->At high exposures: coma, convulsions, death
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Why Children Are Vulnerable<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Absorb 4–5 times more lead than adults from the same dose
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Hand-to-mouth behavior increases ingestion risk
- &shy;<!-- .element: class="fragment" data-fragment-index="8" -->Malnourished children absorb even more lead
- &shy;<!-- .element: class="fragment" data-fragment-index="9" -->Lead stored in bones can be released during pregnancy, exposing the fetus
</div>



Lead poisoning is preventable, yet it persists in low-income housing because remediation is expensive and landlords lack incentive to invest.<!-- .element: class="feature fragment" -->
</div>







</div> 

<div class="source" style="position: absolute; left: 1%; top: 85%; height: 3%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: end" >

<div class="text-row" style="position: absolute; left: 1%; top: 6%; height: 10%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">


<div class="block">

Pest infestations are not a sign of poor housekeeping—they are a sign of poor housing. **Structural defects and neighborhood conditions drive infestations.**

</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

</div>

<!-- .element: class="fit-image" -->











<div class="block">

<div class="block">

<!-- .element: class="divider-list" -->
Cockroaches<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**3.9X more likely** in homes with sagging roofs
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Associated with cracked walls, broken windows, and water leaks
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Shed skin and feces contain allergens that trigger asthma
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Carry bacteria (salmonella, staph, strep) that contaminate food
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Rodents<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**5.6X more likely** in homes with walls that slope, lean, or buckle
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Associated with proximity to trash and abandoned buildings
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Transmit hantavirus, rat-bite fever, tularemia, and enteric pathogens
- &shy;<!-- .element: class="fragment" data-fragment-index="8" -->Transmission occurs through inhalation of aerosolized feces, urine, or saliva
</div>



</div>







</div>

<div class="text-row" style="position: absolute; left: 1%; top: 6%; height: 10%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">


<div class="block">

Manufacturers add chemicals to products to make them last longer on shelves—often at the cost of human health.
</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

<!-- .element: class="fit-image" -->











<div class="block">

<div class="block">

<!-- .element: class="divider-list" -->
Common Toxic Materials<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Flame retardants in furniture and carpets
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Formaldehyde in drywall and insulation
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->PVC in pipes and flooring (releases phthalates)
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Persistent bioaccumulative toxics (PBTs) that don't break down
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Health Impacts<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Carcinogens and developmental toxics
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Asthma and respiratory disease
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Endocrine disruption
- &shy;<!-- .element: class="fragment" data-fragment-index="8" -->Chronic exposure in homes and workplaces
</div>



<div class="block">

<!-- .element: class="divider-list" -->
The Equity Problem<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="9" -->Affordable housing is often built with legacy materials and poor construction
- &shy;<!-- .element: class="fragment" data-fragment-index="10" -->Wealthy neighborhoods have newer, greener homes
- &shy;<!-- .element: class="fragment" data-fragment-index="11" -->Low-income residents bear the burden of toxic exposure
</div>



</div>









</div> 

<div class="source" style="position: absolute; left: 1%; top: 85%; height: 3%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: end" >

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Maintain Pharos database of chemicals and hazards

</div>



<div class="block">

<!-- .element: class="divider-list" -->

- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Work with architects and developers on low-income housing
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Show that healthy materials are feasible within budget constraints
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Build proof of concept for scaling
</div>


</div>



<div class="block">

<div class="block">

<!-- .element: class="divider-list" -->

- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Partner with grassroots organizations and community groups
- &shy;<!-- .element: class="fragment" data-fragment-index="8" -->Push for legislation requiring healthy materials in affordable housing
- &shy;<!-- .element: class="fragment" data-fragment-index="9" -->Shift burden from residents to builders and manufacturers
</div>



<div class="block">

- &shy;<!-- .element: class="fragment" data-fragment-index="11" -->Retrofitting is expensive and disruptive
- &shy;<!-- .element: class="fragment" data-fragment-index="12" -->Starting with good habits is more sustainable than correcting bad ones
</div>

The 9 Dimensions of Walkable Neighborhoods

</div>

 
</div> 


<div class="text-row" style="position: absolute; left: 1%; top: 6%; height: 10%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">


<div class="block">

**Streets designed for cars** prioritize speed and throughput over safety and connection. **Streets designed for people** encourage walking, cycling, and social interaction.

</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

<img src="4_System/40_Exports/ENVN4320/attachments/servlet.png" alt="" style="object-fit: scale-down">

</div>

<!-- .element: class="fit-image" -->











<div class="block">

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Connectivity**: Well-linked streets reduce travel distances
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Diversity of Land-Use**: Mixed residential, commercial, and recreational spaces
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Density**: Sufficient population to support transit and local services
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Destination Accessibility**: Everyday amenities within walking distance
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Parking**: Limited parking encourages walking for short trips
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**Streets**: Narrow streets and traffic calming naturally slow vehicles
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->**Hills**: Topography affects walkability (flatter is easier)
- &shy;<!-- .element: class="fragment" data-fragment-index="8" -->**Aesthetics**: Engaging streetscapes with public art and clean sidewalks
- &shy;<!-- .element: class="fragment" data-fragment-index="9" -->**Safety**: Natural surveillance and low crime increase comfort
</div>







</div>

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }
