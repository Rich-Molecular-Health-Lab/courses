        function pageInIframe() {

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {

<div class="has-light-background" style="border-radius: 15px; background-color: white; position: absolute; left: 69%; top: 15%; height: 75%; width: 28%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

A high-pressure system that pushes hot air down and traps it, raising temperatures over a region. Heat domes create prolonged, severe heat waves with record-breaking highs.<!-- .element: class="feature" --> 

</div>

 

<div class="block">

<img src="2_Areas/24_Teaching/ENVN4320_Human_Health_the_Environment/figures/heat_dome.jpg" alt="" style="object-fit: scale-down">

- Greenhouse gas emissions warm the baseline atmosphere
- Heat domes can last days to weeks
- Nighttime temperatures remain dangerously high
- Prevents body and environment from cooling

</div>

- Lack of tree canopy amplifies the effect
- Disproportionately affects low-income neighborhoods

**Heat Exhaustion vs. Heat Stroke**

- **Heat exhaustion:** fatigue, inability to sweat, treatable at home with hydration
- **Heat stroke:** dizziness, loss of speech, cognitive changes, requires emergency care
- **Core mechanism:** sweat cannot evaporate in high heat + humidity, body temperature rises uncontrollably
- **Vulnerable groups:** elderly, people with pre-existing conditions, those on SSRIs, unhoused people

</div>



</div>

<div class="right-box" style="position: absolute; left: 61%; top: 15%; height: 65%; width: 35%; display: flex; flex-direction: column; align-items: start; justify-content: center" >
 

<div class="block">

Heat kills more Americans than hurricanes or wildfires. <!-- .element: class="feature" --> 

Deaths are counted three ways: **direct** (heat stroke), **indirect** (heart attack during heat), and **excess deaths** (statistical comparison to baseline).

- **Direct deaths:** ~2,300 in U.S. in 2023 (3× higher than a decade ago)
- **Indirect deaths:** cardiovascular, respiratory, stroke, complications from diabetes
- **Global toll:** ~500,000 deaths per year
- **Undercount:** many heat deaths go unrecognized because physicians treat the immediate condition, not the heat trigger

</div>



</div>











 

<div class="footer-course" style="position: absolute; left: 0%; top: 85%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

 © 2026 Alicia M. Rich, Ph.D.
 
</div>
</div>

<div class="block">

Not everyone has access to air conditioning. Low-cost, evidence-based strategies can reduce heat stress and prevent deaths.

- Immersing feet in water (acts as radiator)
- Using fans (effective under right conditions)
- Seeking shade (can reduce temperature by up to 30°C)
- Drinking water regularly (even without thirst signal)
- Checking on neighbors and elderly relatives
- Accessing public pools, splash pads, cooling centers
- Shifting outdoor activity to early morning/evening
</div>

<div class="block">

Trees reduce ambient temperature by up to 10°C through shade and evaporative cooling. They are one of the most cost-effective, long-term heat mitigation strategies.<!-- .element: class="feature" --> 

- Shade fundamentally changes body energy expenditure
- Trees cool surrounding air through water evaporation
- Green infrastructure competes with parking and car-centric design
- Requires sustained funding and maintenance
- Takes years to mature—planting must start now

</div>

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];

                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }
