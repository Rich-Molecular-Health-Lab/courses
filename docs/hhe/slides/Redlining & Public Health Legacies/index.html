<div class="block">

Omaha's Black Belt as a Racial Covenant

</div>

 
</div> 

<div class="slide-image" style="position: absolute; left: 1%; top: 10%; height: 75%; width: 60%; display: flex; flex-direction: column; align-items: start; justify-content: center" >
 

<div class="block">

<img src="2_Areas/24_Teaching/ENVN4320_Human_Health_the_Environment/figures/redlining/omaha_black_belt_1919.png" alt="" style="object-fit: scale-down">

</div>

<!-- .element: class="fit-image" --> 

</div> 

<div class="right-box" style="position: absolute; left: 61%; top: 15%; height: 65%; width: 35%; display: flex; flex-direction: column; align-items: start; justify-content: center" >
 

<div class="block">

Racial covenants are legally binding clauses included in property deeds that prevented sale to or occupancy by a person of color.<!-- .element: class="feature" -->

 - In 1919, a race riot of ~20,000 white people attacked the Near North Side neighborhood.
 - The Army commanded black citizens to stay within a specific area where they could protect them.

>This protective isolation quickly became a type of martial law where African Americans were restricted to the Near North Side neighborhood. This became Omaha's "Black Belt."

- Despite being isolated, Omaha's Black community began to flourish in North Omaha.
</div>



</div>











 

<div class="footer-course" style="position: absolute; left: 0%; top: 85%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: start; justify-content: center" >
 
<div class="block">

ENVN 4320 Human Health & the Environment
</div>



</div> 

<div class="footer-copyrite" style="position: absolute; left: 74%; top: 85%; height: 5%; width: 25%; display: flex; flex-direction: column; align-items: start; justify-content: center" >
 

 © 2026 Alicia M. Rich, Ph.D.
 
</div>
</div>

<aside class="notes"><p>However, they were met by heavy machine <a href="http://www.nebraskastudies.org/0700/frameset_reset.html?http://www.nebraskastudies.org/0700/stories/0701_0135.html">guns and troops</a> from North Omaha’s Fort Omaha, and failed to cause any significant physical damage. However, this was the beginning of official segregation in Omaha’s housing: the Army commanding blacks to stay within a specific area where they could protect them, and that area become red lined.</p>
<blockquote>
<p>This protective isolation was enacted only for temporary safety reasons; however, it quickly became a type of martial law where African Americans were restricted to the Near North Side neighborhood. This became Omaha&#39;s &quot;Black Belt.&quot;</p>
</blockquote>
<p>However, despite being isolated – or because of it – Blacks began to flourish in North Omaha. <a href="https://northomahahistory.com/2019/12/28/a-history-of-businesses-owned-by-african-americans-in-omaha/">They opened businesses</a> in rented storefronts from Jewish building owners along North 24th, built churches and <a href="https://northomahahistory.com/2015/09/08/a-history-of-north-omahas-social-clubs-and-social-halls/">social halls</a>, created their own institutions and soon began to flourish around Lake Street. By 1920, the Near North Omaha neighborhood was home to an <a href="https://northomahahistory.com/2016/12/30/colored-old-folks-home/">Old Colored Folks Home</a> and the <a href="https://northomahahistory.com/2019/01/31/negro-womens-christian-association-of-omaha/">Colored YWCA</a> sponsored a group of Black Red Cross nurses. African American families shopped in Black-owned businesses, attended Black churches, <a href="https://northomahahistory.com/2018/02/06/a-history-of-segregated-schools-in-omaha-nebraska/">sent students to Black schools</a>, and sent the dead to Black caretakers.</p>
<p>They also did business with whites and Jewish people, rented homes from white landlords, and were sometimes allowed to interact with white people in downtown Omaha, despite many businesses having signs in their windows reading “No Negroes Allowed.”</p>
</aside></script></section><section data-separator="?

<div class="block">

- **1933**: HOLC established by FDR as part of the New Deal
- **1934**: National Housing Act codified lending criteria

The federal government used the National Housing Act to systematically deny loans and services to non-White neighborhoods, labeled as "undesirable" for real estate investment.<!-- .element: class="feature" -->

- This disincentivized investment & growth in Omaha's **"Black Belt"**.
- **1968**: Fair Housing Act passed (rarely enforced)
- **Today**: Effects still visible in neighborhood demographics, property values, and environmental conditions

</div>



</div>

<div class="block">

**Grade A** — "Best" areas
- Wealthy businessmen, homogeneous (white)
- Green on maps

**Grade B** — "Good" areas  
- White-collar families, still desirable
- Blue on maps

**Grade C** — "Declining" areas
- Working-class families, "infiltration" of lower-grade populations
- Yellow on maps

**Grade D** — "Hazardous" areas
- "Foreign-born" people, "low-class whites," and **people of color**
- Red on maps (origin of term "redlining")

</div>



</div>











 

<div class="footer-course" style="position: absolute; left: 0%; top: 85%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

<div class="block">

More affluent neighborhoods have greater tree canopy cover, larger mature trees, and higher bird diversity. Low-income areas have more asphalt, concrete, and fewer green spaces.<!-- .element: class="feature" -->

This is not random—it reflects decades of disinvestment from redlined areas.

- **Canopy cover**: Redlined neighborhoods have ~50% less tree cover than historically white neighborhoods
- **Urban heat islands**: Lack of shade + more asphalt = hotter neighborhoods
- **Air pollution**: Redlined areas more likely near highways, industrial plants
- **Biodiversity loss**: Fragmented habitats reduce breeding and gene flow in animal populations
- **Pest increase**: Mosquitoes and rats thrive in degraded ecosystems, spreading disease

</div>



</div>

<div class="block">

The Planning Accreditation Board (PAB) and AICP Code of Ethics now require planners to promote justice, equity, diversity, and inclusion (DEI).

This is a direct response to redlining's legacy.

**Modern equitable planning tools:**
- Environmental justice mandates (Executive Order 12898)
- Equitable taxation policies
- Participatory budgeting
- Stakeholder engagement with conflict resolution
- Policy and fiscal impact analyses
- Targeted investment in historically disadvantaged communities

**The goal**: Reverse the effects of redlining through intentional, data-driven reinvestment.

</div>

    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }
