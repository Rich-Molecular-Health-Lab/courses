        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

>"Biological diversity means the variability among living organisms from all sources ... this includes diversity within species, between species, and of ecosystems."

Biodiversity can be measured at **any scale** — a single plot, a continent, an ocean basin, or the entire planet — and at **any point in time**, from the present back through the history of life on Earth.

Measuring Genetic Diversity: Genome Size
</div>

 
</div> 

<div class="slide-image" style="position: absolute; left: 1%; top: 10%; height: 75%; width: 70%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

<!-- .element: class="fit-image" -->

<div class="right-box" style="position: absolute; left: 72%; top: 15%; height: 65%; width: 25%; display: flex; flex-direction: column; align-items: start; justify-content: center" >
 

<div class="block">

The most basic measure of genetic diversity is **genome size** — the amount of DNA in one copy of a species' chromosomes.

- Ranges from 0.0023 pg in a parasitic microsporidian to 1400 pg in a free-living amoeba
- Humans: 3.5 pg (≈3.4 billion base pairs)
- Chromosome number varies from 2 (jumper ant) to 1260 (adder's-tongue fern)
- Genome size and gene count are usually **not** correlated
</div>

<!-- .element: class="right-text" --> 

</div>

<div class="block">

Genetic diversity within a species is commonly quantified as:

- **Allelic diversity** — average number of alleles per locus
- **Gene diversity** — heterozygosity across loci
- **Nucleotide differences**

Larger, more stable populations — and populations near the center of a species' range — tend to carry more genetic diversity than small, fluctuating, or peripheral ones.
</div>

</div>

<div class="block">

Calculating Heterozygosity & Polymorphism
</div>

 
</div> 

<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 80%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





**Observed heterozygosity (H₀):** proportion of individuals heterozygous at a locus.

$$H\_O = \\frac{\\text{number of heterozygotes}}{\\text{total individuals}}$$

**Expected heterozygosity (Hₑ), or gene diversity:** calculated from allele frequencies under Hardy–Weinberg expectations.

$$H\_E = 1 - \\sum p\_i^2$$

where *pᵢ* is the frequency of the *i*th allele at that locus. **Mean heterozygosity** is Hₑ (or H₀) averaged across all loci examined.


 
</div>

<div class="footer-course" style="position: absolute; left: 0%; top: 85%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

A Worked Example
</div>

 
</div> 

<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 80%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





| Locus | Allele frequencies | Hₑ = 1 − Σpᵢ² | Polymorphic? |
|---|---|---|---|
| 1 | 0.6, 0.4 | 1 − (0.36+0.16) = **0.48** | Yes |
| 2 | 1.0 | 1 − 1.00 = **0.00** | No |
| 3 | 0.5, 0.3, 0.2 | 1 − (0.25+0.09+0.04) = **0.62** | Yes |

**Mean heterozygosity** = (0.48 + 0.00 + 0.62) / 3 = **0.37**

**Polymorphism (P):** proportion of loci where the most common allele's frequency falls below a threshold (commonly 0.95 or 0.99) — here, loci 1 and 3 qualify.

$$P = \\frac{\\text{polymorphic loci}}{\\text{total loci}} = \\frac{2}{3} = 0.67$$


 
</div>

Measuring Biodiversity: Why No Single Measure
</div>

 
</div> 

<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 80%; display: flex; flex-direction: column; align-items: start; justify-content: center" >




Given the multiple dimensions of biodiversity, there can be **no single measure** of it. Any analysis has to be framed in terms of a particular element (genetic, organismal, ecological) or group.

Measures also split into two kinds:

- **Number measures** — disregard differences between elements (e.g. species richness)
- **Heterogeneity measures** — explicitly incorporate those differences (e.g. an abundance-weighted diversity index)


 
</div>

<div class="footer-course" style="position: absolute; left: 0%; top: 85%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

Number vs. Heterogeneity Measures
</div>

 
</div> 

<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 80%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





A group of 10 species where one dominates numerically, versus a group of 10 species with evenly distributed abundances — are these **equally biodiverse**?

Number measures say yes (same richness). Heterogeneity measures say no (very different degrees of evenness).

The same question applies taxonomically: is a group of 10 closely-related skipper butterfly species as biodiverse as 5 skippers + 5 swallowtails?


 
</div>

Why Species Richness Dominates in Practice
</div>

 
</div> 

<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 80%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





Biodiversity is most often expressed as **species richness** — a pragmatic choice, since organismal diversity is better documented and more consistently resolved than genetic or ecological diversity.

**But it's limited:** most organismal diversity remains unknown, taxonomic delimitation is disputed for many groups, and it's only one — fairly narrow — perspective on biodiversity.


 
</div>

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 80%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





Old species inventories are treasure troves — baselines for measuring loss and turnover over time.

**Singapore case study:** comparing historic and modern inventories, researchers found **28% of original species lost** overall — higher (34–43%) in butterflies, freshwater fish, birds, and mammals — largely from deforestation.


 
</div>

Monitoring Biodiversity: Turnover & Vulnerability
</div>

 
</div> 

<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 80%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





A 100-year comparison of bird communities in a small Singapore forest fragment found many native forest species lost and replaced by introduced species (e.g. the house crow) — by 1998, 20% of individuals observed were introduced.

Comparing traits of extinct vs. surviving species (e.g. in butterflies and plants) shows **forest dependence** and **high host-plant specificity** predict vulnerability to habitat disturbance.


 
</div>

Why This Matters for Conservation
</div>

 
</div> 

<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 80%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





- No single number captures biodiversity — conservation decisions have to specify **which** element and **which kind** of measure they're using
- Measurement techniques scale from genes (heterozygosity) to species (richness) to communities (connectance, FD, PD) to whole landscapes (ecoregions)
- Monitoring — repeated measurement against a baseline — is what turns a snapshot into evidence of change


</div>
