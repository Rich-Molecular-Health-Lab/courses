        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };

<aside class="notes"><p>Desertification (world map of vulnerability, shaded low to very high): the range and intensity of desertification have increased in some dryland areas over the past several decades. The most people affected are in South and East Asia, the circum-Sahara region including North Africa, and the Middle East including the Arabian Peninsula. Regions shaded red, orange, and yellow are vulnerable and could become deserts over the next several decades. Desertification hotspots, identified by a decline in vegetation productivity between the 1980s and 2000s, extended to about 9.2% of drylands (±0.5%), affecting about 500 (±120) million people in 2015.</p>

<aside class="notes"><p>Agricultural pollutants. Eutrophication: human sewage, agricultural fertilizers, detergents, and industrial processes release large amounts of nitrates and phosphates into aquatic systems, starting eutrophication, the leading cause of degraded water quality worldwide. Pesticides: birds such as hawks and eagles that ate insects, fish, or other animals from DDT-contaminated habitats suffered reproductive failure due to thinning and breaking of eggshells. DDT has been banned by many industrialized nations but is still used, with other organochlorine compounds, for pest control in some countries. Photos of an algal bloom and crop dusting. Linked video: <a href="https://youtu.be/Y70I_kADGQY">https://youtu.be/Y70I_kADGQY</a></p>

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
