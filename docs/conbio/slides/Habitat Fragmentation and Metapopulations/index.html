            const itemsToFit = document.getElementsByClassName('fitText');

                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);

            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();

</aside></script></section><section data-separator="?

<aside class="notes"><p>Levins&#39; metapopulation model: Richard Levins developed a simple model to describe patch occupancy in metapopulations. (1) Occupied or unoccupied: each patch is either occupied (1) or unoccupied (0), ignoring local population dynamics. (2) Patch extinction: at each time step, occupied patches go extinct with probability ε (epsilon). (3) Colonization: unoccupied patches can be colonized with probability γ (gamma). (4) Occupancy fraction: the objective of the model is to estimate the fraction of patches occupied, Ψ (psi).</p>

<aside class="notes"><p>Island biogeography originally focused on biodiversity patterns observed on isolated islands, but the concept has been extended to any habitat fragment isolated from similar habitats, whether or not it is a true island. Key elements: (1) isolation: isolated habitats (like islands) have unique ecological characteristics because they are separated from similar habitats; (2) species diversity: island biogeography studies how species richness and composition change with island size and isolation, predicting that larger islands closer to the mainland will have higher species diversity due to larger habitats and easier colonization. Implications: island biogeography has practical implications for managing and preserving biodiversity in fragmented landscapes.</p>
</aside></script></section><section data-separator="?

<aside class="notes"><p>Source-sink patterns: issues encountered when conservationists ignore them. (1) Spatial conservation planning: basic algorithms consider spatial connectivity but assume species density indicates metapopulation persistence, so the long-term robustness of protected area networks could be limited if some or all prioritized sites for a species are actually sinks. (2) Conservation value of selectively logged forests: most studies of logging impacts have examined patches adjacent to intact primary forest, and impacts are usually assessed with relative measures of abundance, density, or incidence. (3) Species distribution modelling: in source-sink systems, species distribution models (SDMs) overestimate a species&#39; bioclimatic niche by including low-suitability areas (sinks), producing unreliable predictions of current and future distributions.</p>

<aside class="notes"><p>In summary, metapopulation theory focuses on how spatially structured populations persist in a landscape of habitat patches that may go through cycles of local extinction and recolonization. Key elements: (1) population dynamics: interconnected populations in patches of suitable habitat may experience local extinctions and recolonizations over time; (2) habitat quality and connectivity between patches are important for metapopulation persistence; (3) source-sink dynamics: metapopulations often balance source populations (sustainable and exporting individuals) and sink populations (dependent on immigration to persist). Implications: metapopulation theory is relevant for understanding population viability in fragmented landscapes, conservation strategies such as corridors between habitat patches, and disease spread in human-altered landscapes.</p>
</aside></script></section></div>
