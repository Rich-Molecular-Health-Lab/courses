        function pageInIframe() {
            return (window.location !== window.parent.location);

            if(forgetPop){

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){

Why Species Extinction Comes First
</div>

 
</div> 

extinction_statista.jpeg<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 95%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





Biodiversity means three things: diversity **within** species (genetic), diversity **of** species, and diversity **of** ecosystems.

**Population extinction is often reversible** — some species eliminated across much of their range have later been restored (e.g. wild turkeys in the eastern US).

**Species extinction is not.** It's permanent — which is why it demands priority.

 
</div>

</div>

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 95%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





Under the US Endangered Species Act, distinct population segments (e.g. the Florida panther, grizzly bears in the continental US) are protected **as if they were full species**.

>[!question]
>Why protect a population if the sustainable representative populations persist elsewhere?

Native bee populations only pollinate fields within a few km of their habitat.

Measuring the Extinction Rate: E/MSY
</div>

 
</div> 

extinction_statista.jpeg<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 95%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





Extinction rate = extinctions per **million species-years (MSY)**.

**Background rate** (from the fossil record, excluding mass extinctions): approximately **1 E/MSY**.

- Follow 1 million species for a year → expect 1 extinction
- Follow 10,000 bird species → expect 1 extinction per 100 years

 
</div>

<div class="block">

Pre-European Extinctions
</div>

 
</div> 

extinction_statista.jpeg<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 95%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





Human contact with Pacific islands began 5,000–2,000 years ago — well before Europeans arrived.

- **Hawaii**: 70–90 of an original ~125–145 endemic bird species lost
- Broader Polynesian expansion: comparable losses across islands
- **Madagascar**: lost 40% of its large mammals after first human contact

Estimated rate: **~100 E/MSY** — a hundred times background.

*Source: Pimm et al. 1994; Simons 1997*
 
</div>

Counting Historical Bird Extinctions (1500–present)
</div>

 
</div> 

extinction_statista.jpeg<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 95%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





154 extinct/presumed-extinct species out of 9,975 total bird species since 1500.

Naive calculation: 154 ÷ (506 years × 9,975 species) = **31 E/MSY**

But this assumes scientists tracked *every* species for the full 506 years — they didn't (species description ramped up through the 1700s–1800s). Correcting for actual known-years pushes the rate to **~85 E/MSY**.

*Source: Pimm et al. 2006*
 
</div>

21st-Century Extinction Projections
</div>

 
</div> 

extinction_statista.jpeg<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 95%; display: flex; flex-direction: column; align-items: start; justify-content: center" >





BirdLife International (2006) lists **1,210 threatened bird species**, including 182 "critically endangered."

- If those 182 disappear over 30 years → **500 E/MSY**
- If all ~1,300 threatened/data-deficient species disappear over a century → **1,300+ E/MSY**

That's an order of magnitude above current rates.
 
</div>

- Plants: 16% of 300,000 described species threatened — and ~100,000 more species may remain undescribed, likely rare and threatened too
- Mammals: 400+ new species described since 1993 (~10% of the total), mostly in habitats already being destroyed

**No.** The actual predictor is **rarity** — small geographic range or low local abundance. Island species are simply rare *because* islands restrict range.

Continental species with equally small ranges are **just as threatened**, even if they haven't gone extinct yet.

Despite near-total historical deforestation, only **4 land bird species** went extinct (Carolina parakeet, passenger pigeon, ivory-billed woodpecker, Bachman's warbler) out of ~160 forest species.

Why so few? Only **30 species** were actually endemic (small-ranged) to the region — most others survived because their ranges extended into Canada or the western US.

Applying Law 7 to just those 30 endemics predicts **4.8 extinctions** — remarkably close to the observed number.

Thomas et al. (2004) estimate climate change threatens **15–37% of species** within 50 years, depending on the emissions scenario.

extinction_statista.jpeg<!-- .element: class="fit-image" -->

<div class="text-box" style="position: absolute; left: 5%; top: 12%; height: 70%; width: 95%; display: flex; flex-direction: column; align-items: start; justify-content: center" >
