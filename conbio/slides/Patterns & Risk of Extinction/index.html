        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");

        }
        window.onpopstate = onPopState;

            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }

<div class="text-row" style="position: absolute; left: 1%; top: 6%; height: 10%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">


<div class="block">

Extinction exists on a spectrum. A species may be lost from one place but survive elsewhere, or persist only in human care.

</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

</div>

<!-- .element: class="fit-image" -->











- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Globally Extinct**: No individuals alive anywhere
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Extinct in the Wild**: Survives only in zoos, botanical gardens, or captivity
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Extirpated**: Lost from a local area, but populations exist elsewhere
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Functionally Extinct**: So few individuals remain that the species no longer affects its ecosystem






</div> 

<div class="source" style="position: absolute; left: 1%; top: 85%; height: 3%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: end" >


<div class="block">

**Passenger pigeons** were once a quarter of all birds in North America. Flocks a mile wide took days to pass overhead.

</div>




</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

</div>

<!-- .element: class="fit-image" -->











<div class="block">

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Market hunting made them easy targets (billions in large flocks)
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Shipped by the millions to eastern cities
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Their biology worked against them: low egg-laying rates, dependence on large flocks for protection and reproduction
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Result**: Complete extinction in just a few decades


Martha, the last passenger pigeon, died in the Cincinnati Zoo on September 1, 1914—one of the rare extinctions we can date precisely.<!-- .element: class="feature fragment" -->

</div>






</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

<div class="block">

<!-- .element: class="divider-list" -->

- Ordovician-Silurian
- Late Devonian
- End Permian (worst: ~96% of species)
- Triassic-Jurassic
- Cretaceous-Paleogene (dinosaurs)
</div>



<div class="block">

<!-- .element: class="divider-list" -->

- Climate change
- Invasive species
- Overexploitation
- Ocean acidification
</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

The Italian peninsula<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Located in the center of the Mediterranean Basin, one of the world’s hotspots of biodiversity
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Exceptionally high levels of diversity for a variety of plant and animal taxa
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->~900 protected areas occupying ~11% of the country's terrestrial surface.
	- The number and size of PAs is under continuous change

Biodiversity knowledge for most of the Italian protected areas is extremely poor, especially for invertebrates.<!-- .element: class="feature fragment" -->

</div>







</div> 

<div class="source" style="position: absolute; left: 1%; top: 85%; height: 3%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: end" >


<div class="block">

Source: Fattorini, S. (2020) [Beetle Species–Area Relationships and Extinction Rates in Protected Areas.](https://doi.org/10.3390/insects11090646) Insects, 11(9), 646.

<div class="fragment" style="padding: 1px 20px; box-sizing: border-box; position: absolute; left: 1%; top: 77%; height: 3%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

 © 2026 Alicia M. Rich, Ph.D.
 
</div>
</div>

<aside class="notes"><p>The Italian peninsula is located in the center of the Mediterranean Basin, one of the world’s hotspots of biodiversity, showing exceptionally high levels of diversity for a variety of plant and animal taxa. At the same time, due to the profound, millenary impacts on the wilderness of this area, the Mediterranean biodiversity has been strongly influenced by the human presence, and it is currently under many threats.</p>
<p>According to the last official report, in Italy there are some 900 protected areas, occupying a terrestrial surface of about three million hectares (about 11% of the country), plus about other 400 areas that benefit from some form of protection, for a further 430,000 hectares. The number and size of protected areas is, however, under continuous change.</p>
<p>Biodiversity knowledge for most of the Italian protected areas is extremely poor, especially for invertebrates.</p>
</aside></script></section><section data-separator="?

</div>

<div class="has-light-background stretch-row flex-even" style="background-color: #ffffffBF; padding: 1px 1px 1px 5px; box-sizing: border-box; position: absolute; left: 1%; top: 15%; height: 68%; width: 98%; display: flex; flex-direction: row; align-items: start; justify-content: start" align="stretch">

<div class="block">

<div class="block">

<!-- .element: class="divider-list" -->
Beetles<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Beetles are the most diversified group of living organisms, constituting about 40% of all described insect species and 25% of all known life-forms.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Beetles occur in most terrestrial and freshwater habitats and are ecologically extremely diversified, which makes these insects very useful in comparative analyses.
</div>



Fattorini used data on beetle groups characterized by very different ecology (terrestrial predators, aquatic predators, dung feeders, herbivores, and terrestrial detritivores) from Italian reserves to investigate how extinction rates based on the use of the SAR vary according to the beetle’s ecology.<!-- .element: class="feature fragment" -->

</div>







</div> 

<div class="source" style="position: absolute; left: 1%; top: 85%; height: 3%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: end" >


<div class="block">

Source: Fattorini, S. (2020) [Beetle Species–Area Relationships and Extinction Rates in Protected Areas.](https://doi.org/10.3390/insects11090646) Insects, 11(9), 646.
</div>




</div>

<div class="fragment" style="padding: 1px 20px; box-sizing: border-box; position: absolute; left: 1%; top: 77%; height: 3%; width: 98%; display: flex; flex-direction: column; align-items: start; justify-content: center" >

</div>

 © 2026 Alicia M. Rich, Ph.D.
 
</div>
</div>

<aside class="notes"><p>However, for at least some groups, there is information about the number of species present in some reserves. In particular, thanks to the interest of professional and amateur entomologists, some beetle groups are among the few invertebrates for which it is possible to gather reliable values of species richness for sets of Italian reserves. Beetles are the most diversified group of living organisms, constituting about 40% of all described insect species and 25% of all known life-forms. Beetles occur in most terrestrial and freshwater habitats and are ecologically extremely diversified, which makes these insects very useful in comparative analyses: for example, with reference to their trophic habits, dispersal capabilities, and ecological preferences.</p>
<p>In this paper, I used data on beetle groups characterized by very different ecology (terrestrial predators, aquatic predators, dung feeders, herbivores, and terrestrial detritivores) from Italian reserves to investigate how extinction rates based on the use of the SAR vary according to the beetle’s ecology.</p>

<div class="block">

<div class="block">

<!-- .element: class="divider-rows" -->
Predictive Version<!-- .element: class="divider" -->
- $$S1 = S0 (A1/A0)z$$
- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**A0** = current size of protected area
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**A1** = size of protected area following habitat loss
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**S0** = number of beetle species before habitat loss
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**S1** = number of beetle species after habitat loss
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->*If the original area A0 is reduced to A1, the original number of species S0 is expected to decline to S1.*
</div>



<div class="block">

<!-- .element: class="divider-list" -->
Result<!-- .element: class="divider" -->
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->z-values did not vary significantly between groups
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->overall significant difference between c-values (F = 18.72, P << 0.001). 
- &shy;<!-- .element: class="fragment" data-fragment-index="8" -->C-values decreased in the following order:
	+ (a) Carabidae (48 species) < (b) Hydradephaga (20) < (d) phytophagous Scarabaeoidea (8) ~ (f) Tenebrionidae (7) ~ (c) coprophagous Scarabaeoidea (5).
</div>

<aside class="notes"><p>Species–area relationships (SARs) for various beetle groups in Italian reserves: (a) Carabidae, (b) Hydradephaga, (c) coprophagous Scarabaeoidea, (d) phytophagous Scarabaeoidea, (e) total Scarabaeoidea, (f) Tenebrionidae. Decimal logarithms are used.</p>
<p>SARs were first modelled using the linearized version of the power function (Equation (2)) with log10. Values of c and z for the SAR of the various groups were compared using Analysis of Covariance (ANCOVA). z-values of SARs were used to calculate the expected number of species lost with increasing area loss using Equation (3).</p>
<p>The power function modelled SARs of the various groups with very similar goodness of fit. z-values, which indicate the rate at which species accumulate with area, did not vary significantly between groups (ANCOVA: F = 1.536, P = 0.200). By contrast, ANCOVA indicated an overall significance difference between c-values (F = 18.72, P &lt;&lt; 0.001). c-values, which represent the expected number of species per area unit, decreased in the following order (~indicates that differences in c-values were not significant in pairwise ANCOVAs): Carabidae (48 species) &lt; Hydradephaga (20) &lt; phytophagous Scarabaeoidea (8) ~ Tenebrionidae (7) ~ coprophagous Scarabaeoidea (5).</p>

Reserve area was recovered as an important predictor of species richness in all cases.<!-- .element: class="feature fragment" -->
