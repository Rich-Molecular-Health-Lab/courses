    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };

>Hooker Chemical Company began dumping industrial waste into the Love Canal near Niagara Falls, NY in the 1940s. 

- Love Canal residents reported strange odors and blue goo bubbling into their basements.
- High rates of asthma, miscarriages, mental disabilities, and other health problems brought Love Canal into the spotlight in 1978

56% of children born there between 1974 and 1978 had birth defects.<!-- .element: class="feature" -->

<aside class="notes"><ul>
<li>After the site was later sold and developed, Love Canal residents reported strange odors and blue goo bubbling into their basements.</li>
<li>High rates of asthma, miscarriages, mental disabilities, and other health problems brought Love Canal into the spotlight in 1978, and subsequent surveys found that 56% of children born there between 1974 and 1978 had birth defects.</li>
<li>New York State Health Commissioner David Axelrod called the incident a “national symbol of a failure to exercise a sense of concern for future generations.” The U.S. government soon after passed the Superfund law.</li>
</ul>

<aside class="notes"><ul>
<li>Soulé argued that conservation biology differs from most other biological sciences in that it is a crisis discipline</li>
<li>Conservation biologists are often asked for advice and input by government and private agencies.  </li>
<li>Therefore, the “expert” is expected to provide quick, unambiguous answers even in the absence of complete knowledge. </li>
<li>This is a major challenge for conservation biologists, who must walk a fine line between scientific credibility and taking action and providing advice based on general and perhaps incomplete knowledge</li>

    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
